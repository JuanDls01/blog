<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrowDark2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="478" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="600" fill="#1e1e1e">Colas de mensajes</text>

  <!-- Producer -->
  <rect x="50" y="270" width="160" height="80" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="130" y="315" text-anchor="middle" font-size="18" fill="#1e1e1e">Producer</text>

  <!-- Queue -->
  <rect x="310" y="240" width="220" height="140" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="262" text-anchor="middle" font-size="18" fill="#92600d">Queue</text>

  <rect x="330" y="290" width="50" height="50" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="355" y="320" text-anchor="middle" font-size="13" fill="#1e1e1e">msg</text>

  <rect x="390" y="290" width="50" height="50" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="415" y="320" text-anchor="middle" font-size="13" fill="#1e1e1e">msg</text>

  <rect x="450" y="290" width="50" height="50" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="475" y="320" text-anchor="middle" font-size="13" fill="#1e1e1e">msg</text>

  <!-- Consumer -->
  <rect x="590" y="270" width="160" height="80" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="670" y="315" text-anchor="middle" font-size="18" fill="#1e1e1e">Consumer</text>

  <!-- Arrows -->
  <path d="M210,310 L306,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowDark2)"/>
  <text x="225" y="300" font-size="14" fill="#1e1e1e">publish</text>

  <path d="M530,310 L586,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowDark2)"/>
  <text x="537" y="300" font-size="14" fill="#1e1e1e">consume</text>

  <text x="400" y="430" text-anchor="middle" font-size="16" fill="#6b7280">Producer y consumer no necesitan estar disponibles al mismo tiempo</text>
  <text x="400" y="452" text-anchor="middle" font-size="16" fill="#6b7280">— quedan desacoplados en el tiempo.</text>
</svg>
