<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --icon-accent: #0d6e5f; }
    @media (prefers-color-scheme: dark) {
      :root { --icon-accent: #3ecfae; }
    }
    .glow, .core {
      transform-origin: 16px 16px;
      animation: pulse 2.6s ease-in-out infinite alternate;
    }
    .glow { animation-delay: -0.3s; }
    @keyframes pulse {
      from { transform: scale(0.85); opacity: 0.55; }
      to   { transform: scale(1.15); opacity: 1; }
    }
  </style>
  <defs>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>
  <circle class="glow" cx="16" cy="16" r="10" fill="var(--icon-accent)" opacity="0.35" filter="url(#soft-blur)" />
  <circle class="core" cx="16" cy="16" r="5" fill="var(--icon-accent)" />
</svg>
